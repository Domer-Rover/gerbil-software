# Gazebo smoke test: build the sim packages, launch school_loop headless,
# drive a 3 m Nav2 goal. See docs/simulation.md ("CI smoke test").
#
# Separate from ci.yml on purpose: ci.yml is kept byte-identical with
# capybara-software, and this job only makes sense for the Gerbil sim.
#
# It installs the sim's apt packages straight into ros:humble-ros-base rather
# than building docker/Dockerfile.sim, which would also pull in the whole VNC
# desktop. Keep the package list in step with Dockerfile.sim (GUI-only
# packages such as rviz2, teleop and foxglove are left out here).
name: sim

on:
  pull_request:
    paths:
      - 'src/gerbil_gazebo/**'
      - 'src/gerbil_description/**'
      - 'src/gerbil_bringup/**'
      - 'docker/Dockerfile.sim'
      - 'docker/sim/**'
      - '.github/workflows/sim.yml'
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: ros:humble-ros-base
      # Fast DDS shared memory and Gazebo both want more than Docker's 64 MB
      options: --shm-size=2g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          apt-get update
          apt-get install -y \
            ros-humble-ros-gz \
            ros-humble-ign-ros2-control \
            ros-humble-ros2-control \
            ros-humble-ros2-controllers \
            ros-humble-diff-drive-controller \
            ros-humble-joint-state-broadcaster \
            ros-humble-controller-manager \
            ros-humble-xacro \
            ros-humble-robot-state-publisher \
            ros-humble-navigation2 \
            ros-humble-robot-localization \
            ros-humble-twist-mux \
            ros-humble-laser-filters \
            python3-numpy \
            python3-yaml \
            python3-serial \
            python3-colcon-common-extensions \
            libegl1 \
            libgl1-mesa-dri \
            mesa-utils \
            procps

      - name: Build
        timeout-minutes: 15
        run: |
          source /opt/ros/humble/setup.bash
          # Same ignore list and --symlink-install as the gerbil-sim container
          export COLCON_DEFAULTS_FILE="$GITHUB_WORKSPACE/docker/sim/colcon_defaults.yaml"
          colcon build --event-handlers console_cohesion+

      - name: Smoke test
        timeout-minutes: 10
        env:
          LOG_DIR: ${{ github.workspace }}/sim_smoke_logs
          HEADLESS_RENDERING: 'true'
          STARTUP_TIMEOUT: '180'
          GOAL_TIMEOUT: '120'
        run: src/gerbil_gazebo/test/sim_smoke_test.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke-logs
          path: |
            sim_smoke_logs/
            log/
          if-no-files-found: ignore
