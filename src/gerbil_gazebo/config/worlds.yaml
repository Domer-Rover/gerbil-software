# World registry (see the contract in ../README.md).
# key == launch world:= value == <world name=...> in the SDF.
# file is relative to share/gerbil_gazebo/worlds. spawn is the pose of the robot's base_footprint
# origin in the world frame; yaw in radians.

# Ring corridor, 40 x 25 m outer, 3.66 m (12 ft) wide; one lap on the centreline is 115.36 m.
# Spawn: middle of the south long corridor, facing +x (counter-clockwise laps).
# Regenerate with scripts/gen_loop_world.py.
school_loop:
  file: school_loop.sdf
  spawn: {x: 0.0, y: -10.67, z: 0.05, yaw: 0.0}

# URC / MDRS site near Hanksville, UT: 200 x 200 m USGS 3DEP 1 m lidar DEM, 12.8 m relief.
# Spawn: flattest spot near the centre (max slope 2 deg within 2 m); z is ground + 0.1 m.
# Regenerate with scripts/fetch_dem.py --site mdrs_utah.
mdrs_utah:
  file: mdrs_utah.sdf
  spawn: {x: -2.0, y: 0.0, z: 1.55, yaw: 0.0}

# West Beach, Indiana Dunes NP: 200 x 200 m USGS 3DEP 1 m lidar DEM, 14.5 m relief.
# Beach to the north (+y), interdunal flat in the middle, dune toe to the south.
# Spawn: flat interdunal spot near the centre (max slope 1.4 deg within 2 m).
# Regenerate with scripts/fetch_dem.py --site indiana_dunes.
indiana_dunes:
  file: indiana_dunes.sdf
  spawn: {x: 2.0, y: 0.0, z: 1.86, yaw: 0.0}

# The real Gerbil test hallway: a square basement loop, VERIFIED 2.44 m (8 ft)
# wide. The 20 x 20 m outer size is a PLACEHOLDER - measure the real loop and
# regenerate:
#   scripts/gen_loop_world.py --name basement_loop --outer-length L --outer-width W \
#       --corridor 2.44 --doors 0
# With inflation_radius 0.70 this leaves a ~1.04 m zero-cost lane down the middle.
basement_loop:
  file: basement_loop.sdf
  spawn: {x: 0.0, y: -8.78, z: 0.05, yaw: 0.0}
