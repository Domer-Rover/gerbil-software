# /scan_raw (LD19 driver) -> /scan (used by Nav2 costmaps)
#
# filter1 removes returns from the rover itself (chassis + the two rear
# antennas). It works in base_link via TF, so it does not depend on the
# LIDAR's angle convention or mounting rotation.
#
# filter2 (front-180 crop) is DISABLED on purpose: /scan currently carries the
# full 360 deg so the LIDAR's mounting yaw can be read off directly.
#
#   To find the yaw: lidar_joint in mobile_base.xacro is set to yaw=0, so the
#   scan is drawn in the LIDAR's own orientation. Put an object directly in
#   front of the robot, look at /scan in Foxglove with fixed frame base_link,
#   and read the angle A the object appears at, measured CCW from +X. Then set
#   lidar_joint yaw to -A and the scan lines up with the robot.
#
#   Once yaw is known, re-enable filter2 to drop the rear half (the LIDAR sits
#   on the camera mount and looks back over the robot). The bounds are COUPLED
#   to the yaw: a ray at laser angle a points at a + yaw in base_link, so the
#   forward half is a in [-pi/2 - yaw, pi/2 - yaw], and the driver's
#   laser_scan_dir=true negates a. Work it out from the measured yaw rather
#   than guessing between [0, pi] and [pi, 2pi].

scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: rover_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.33   # chassis is 0.61 long: half is 0.305, plus a small margin
        max_x:  0.33
        min_y: -0.26   # outer wheel faces tape at 0.457073: half is 0.2285, plus margin
        max_y:  0.26
        min_z: -1.0
        max_z:  1.0
        invert: false

    # Re-enable once the mounting yaw is known (see the note above).
    # filter2:
    #   name: front_180_only
    #   type: laser_filters/LaserScanAngularBoundsFilter
    #   params:
    #     lower_angle: 0.0
    #     upper_angle: 3.1416
