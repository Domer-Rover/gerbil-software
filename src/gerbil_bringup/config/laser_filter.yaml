# /scan_raw (LD19 driver) -> /scan (used by Nav2 costmaps)
#
# filter1 removes returns from the rover itself (chassis + the two rear
# antennas). It works in base_link via TF, so it does not depend on the
# LIDAR's angle convention or mounting rotation.
#
# filter2 keeps only the forward half of the scan. The LIDAR sits on top of
# the camera mount, so the rear half looks back over the robot and is dropped.
#
#   These bounds are COUPLED to lidar_joint's yaw in mobile_base.xacro. A ray
#   at laser angle a points at a + yaw in base_link, so the forward half is
#   a + yaw in [-pi/2, pi/2]. With yaw = +1.5708 that is a in [-pi, 0], and
#   the driver runs laser_scan_dir=true which negates a, giving [0, pi].
#   Changed from [pi, 2pi] on 2026-11-03 alongside the 180 deg yaw flip;
#   change one and you must change the other.
#
#   VERIFY in Foxglove: stand in front of the rover; you should see returns.
#   If the front is blank and the rear is populated, use [3.1416, 6.2832].
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: rover_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.33   # chassis is 0.61 long: half is 0.305, plus a small margin
        max_x:  0.33
        min_y: -0.26   # outer wheel faces tape at 0.457073: half is 0.2285, plus margin
        max_y:  0.26
        min_z: -1.0
        max_z:  1.0
        invert: false

    filter2:
      name: front_180_only
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        lower_angle: 0.0
        upper_angle: 3.1416
