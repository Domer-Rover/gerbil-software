slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Process near changes only (good for slow robots)
    map_update_interval: 3.0          # update map more frequently
    resolution: 0.05
    # The scan is the LD19 (/scan after laser_filter), not ZED depth. 8 m is
    # the same usable range both Nav2 costmaps take from it (obstacle_max_range);
    # the LD19 is rated to 12 m but far returns drop out more often. Was 5.0
    # with a stale "ZED depth" justification, which cut a 2.44 m wide loop's
    # long walls short when mapping it.
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_timeout: 0.5             # odom -> base_footprint comes from the EKF
    tf_buffer_duration: 30.0

    # (map_size_x / map_size_y were here; they are not slam_toolbox
    # parameters and were silently ignored. The map grows as needed.)

    # Throttle (Jetson Nano friendly)
    throttle_scans: 1
    enable_interactive_mode: true

    # Correlation search (how far to search for loop closures)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15      # take a scan every 15 cm
    minimum_travel_heading: 0.2        # or every ~11 deg of turn (the scan is cropped to the front 180)

    # Correlation search parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure parameters
    loop_search_space_dimension: 4.0   # smaller search = fewer false loop closures
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_variance_coarse: 3.0

    # Fine search
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349

    # Stack size for mapper
    stack_size_to_use: 40000000