# Nav2 config for Gerbil: odom-only navigation (no map, no AMCL).
# Obstacle source is /scan from the LD19 LIDAR (360 deg, ~12 m).
# Uses rolling costmaps in the odom frame for obstacle detection.
# Stack: SmacPlanner2D (grid search) + RPP (geometric follower).
# NOTE this header previously claimed Smac Hybrid-A* and that the choice
# "avoids in-place rotations". Both were false: planner_server configures
# SmacPlanner2D, and in-place rotation is now deliberately ENABLED
# (use_rotate_to_heading: true) because a differential drive cannot crab.
# base_link is at the wheel axle midpoint, so the footprint is asymmetric -
# see the footprint and inflation_radius notes below.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered   # EKF (wheel + ZED VIO)
    transform_tolerance: 2.0  # covers ZED TF startup delay (~1-2s after launch)
    default_server_timeout: 20
    default_cancel_timeout: 50
    introspection_mode: "disabled"
    always_reload_bt_xml: false
    bt_log_idle_transitions: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    waypoint_statuses_blackboard_id: waypoint_statuses
    # SUSPECT, pending scripts/check_nav2_params.py against the live nodes.
    # Several parameters in this file look like they came from a Nav2 newer
    # than Humble, and Nav2 silently ignores anything a node did not declare -
    # exactly how "movement_timeout" sat here doing nothing. Candidates:
    #   bt_navigator       introspection_mode, always_reload_bt_xml,
    #                      bt_log_idle_transitions, default_cancel_timeout,
    #                      waypoint_statuses_blackboard_id
    #   controller_server  path_handler_plugins (and no PathHandler block is
    #                      defined for it), path_length_tolerance on
    #                      SimpleGoalChecker
    # Run the checker with the stack up, then delete whatever it calls DEAD.
    # Do not delete them blind: removing a parameter that IS declared changes
    # behaviour silently in the other direction.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    # 20.0 is the Nav2 default. Was 5.0 to reserve CPU for object detection
    # that is not implemented yet, which is a false economy: at 5 Hz the
    # controller issues a command only every 200 ms and runs SLOWER than the
    # local costmap it reads (update_frequency 10.0), so it acts on obstacle
    # data it has already missed an update of, and collision checks are
    # correspondingly coarse.
    # Lower it when a measurement shows CPU actually binding, not before.
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # diff drive — Y velocity is always ~0
    min_theta_velocity_threshold: 0.001
    failure_timeout: 0.3
    odom_topic: /odometry/filtered   # must match bt_navigator
    odom_duration: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # PoseProgressChecker, not SimpleProgressChecker. SimpleProgressChecker
      # counts only TRANSLATION as progress. With use_rotate_to_heading: true
      # the rover turns in place before moving off, translating ~0 the whole
      # time, so a long turn looks like a stall and the controller aborts.
      # A 180 degree turn at rotate_to_heading_angular_vel 0.5 rad/s takes
      # ~6.3 s before acceleration limits, which is uncomfortably close to the
      # allowance. PoseProgressChecker additionally accepts ROTATION as
      # progress, which is the correct pairing.
      plugin: "nav2_controller::PoseProgressChecker"
      # 0.1 m is fine - it only has to beat odometry noise, which is
      # millimetres. Movement is measured from the last accepted pose, not
      # cumulatively, so this is not a speed requirement.
      required_movement_radius: 0.1
      # 0.5 rad = 29 deg of rotation also counts as progress
      required_movement_angle: 0.5
      # CORRECTED NAME. This was "movement_timeout: 15.0", which is not a
      # parameter either checker declares, so it was silently ignored and the
      # 10.0 default applied. Undeclared params in a Nav2 yaml are dropped
      # without warning - see scripts/check_nav2_params.py.
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.3
      path_length_tolerance: 1.0
      stateful: True

    FollowPath:
      # RotationShimController WRAPS RegulatedPurePursuit rather than replacing
      # it. When the rover's heading differs from the start of the new path by
      # more than angular_dist_threshold it rotates in place until aligned,
      # then hands every subsequent cycle to the primary controller.
      #
      # WHY: a controller handed a path starting behind the rover commands
      # very tight arcs, which on a differential drive looks like thrashing.
      # The shim turns that one case into a predictable in-place rotation. It
      # is ~5 parameters and costs nothing once aligned. DWB alone would
      # eventually rotate too, but via trajectory scoring rather than
      # deliberately, which is slower and less predictable.
      #
      # WHY NOT MPPI: it samples thousands of trajectories per cycle. The Orin
      # Nano is already running ZED neural depth at 30 fps, the LIDAR and a
      # 50 Hz EKF. If MPPI misses its 50 ms budget at 20 Hz the symptom is
      # erratic motion, and it degrades suddenly rather than gracefully.
      # WHY NOT DWB: ~30 interacting critic weights, and the classic failure
      # is exactly the oscillation we are trying to avoid.
      #
      # NOTE ON OBSTACLE AVOIDANCE: the controller is only one layer of it.
      # Obstacles enter via obstacle_layer from /scan, inflation_layer turns
      # them into clearance, planner_server avoids them globally, and the BT's
      # RateController decides how often that replan happens. DWB adds LOCAL
      # avoidance on top via its BaseObstacle critic. If the rover fails to
      # avoid something, check in that order -- the costmap and the replan
      # cadence before anything in this block.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # Rotate in place when more than 45 deg off the path heading.
      angular_dist_threshold: 0.785
      # How far along the path to sample for the heading to rotate toward.
      # Too small and it chases noise in the first path segment.
      forward_sampling_distance: 0.5
      # Both must match the real limits. angular.z.max_velocity in
      # gerbil_controllers.yaml is 0.5, so a larger value here is simply
      # clamped by the controller and makes the shim mispredict its own timing.
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 0.7
      # Collision-check this far ahead while rotating. The footprint is
      # asymmetric with 0.55 m of tail behind the pivot, so rotation sweeps a
      # 0.60 m radius -- this is what stops it rotating into something.
      simulate_ahead_time: 1.0

      primary_controller: "dwb_core::DWBLocalPlanner"

      # ---- DWB, the primary controller the shim hands off to ----
      # Chosen over RegulatedPurePursuit because DWB simulates candidate
      # trajectories and scores them against the costmap, so it checks
      # collisions through the MOTION rather than only ahead of the path. With
      # 0.55 m of tail behind the pivot that matters, and it adds a second
      # layer of avoidance independent of the global path going stale.
      # The RPP block this replaces is preserved in git at 9c2e87a; swapping
      # back is this one plugin line plus that block.

      # Velocity and acceleration limits. These must not exceed
      # diff_drive_controller's linear.x.max_velocity 0.3 and
      # angular.z.max_velocity 0.5, or DWB simulates trajectories the robot
      # cannot execute and then wonders why it is off-path.
      min_vel_x: 0.0
      max_vel_x: 0.26
      min_vel_y: 0.0                   # differential drive, no lateral motion
      max_vel_y: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      max_vel_theta: 0.5
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 0.7               # matches the shim's max_angular_accel
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -0.7

      # Trajectory generation. vx_samples x vtheta_samples trajectories are
      # simulated every cycle, so 20x20 = 400 at 20 Hz. Raise only if the
      # motion looks coarse AND there is CPU headroom.
      vx_samples: 20
      vy_samples: 1                    # must be 1, not 0, for a diff drive
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true   # stop scoring a trajectory once it fails

      # Critics score each simulated trajectory. These are the Nav2 defaults
      # and are deliberately left at default values -- the known DWB failure
      # mode is oscillation from hand-tuned interacting weights, so change one
      # at a time and only in response to an observed behaviour.
      #   BaseObstacle   penalises trajectories crossing costly cells. This is
      #                  what does the local avoidance. It scores the costmap
      #                  under trajectory POINTS, so clearance comes from
      #                  inflation_radius 0.62. The footprint-aware
      #                  alternative is the ObstacleFootprint critic, which is
      #                  more exact for this asymmetric robot but costs more.
      #   Oscillation    forbids reversing direction repeatedly. This is the
      #                  anti-thrash critic -- do not remove it.
      #   PathAlign/PathDist  keep the rover on the global path.
      #   GoalAlign/GoalDist  pull it toward the goal.
      #   RotateToGoal   handles the final yaw once within tolerance.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlanner2D: grid planner with no minimum turning radius. The rover is
      # skid-steer, so the Hybrid-A* car model (DUBIN, min radius 0.4 m) refused
      # paths the rover can actually drive.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true            # outdoor rolling costmap is mostly unknown
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # no "spin": the rover stalls pivoting in place, which is also why
    # use_rotate_to_heading is now true, so a heading error is corrected by
    # turning in place rather than only through recovery behaviours.
    behavior_plugins: ["backup", "drive_on_heading", "wait", "assisted_teleop"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.4

# Both costmaps use odom frame with rolling windows — no static map needed.
# Footprint: rectangular bounding box sized for the rear axle (widest point).
#   X half-length: base_length/2 (0.3556m) + margin → 0.40m
#   Y half-width:  wheel_separation/2 (0.2114m) + half wheel width → 0.23m
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 2.0    # rolling window with no map; the planner runs at ~1Hz
      publish_frequency: 1.0   # visualisation only -- deliberately low
      transform_tolerance: 0.3
      global_frame: odom
      robot_base_frame: base_footprint
      # Half-width 0.24: with wheel_separation 0.44 the outer tyre faces reach
      # 0.44/2 + 0.03195/2 = 0.236, so the old 0.23 cut the wheels out of the
      # footprint and Nav2 would have planned paths that clipped them.
      # Expressed about base_link, which sits at the WHEEL AXLE MIDPOINT, so
      # this polygon is strongly asymmetric - the rover trails its own axle.
      #   chassis    x from -0.5496 to +0.0600   (centre at chassis_x -0.2448)
      #   wheel span y +/-0.2360                 (separation 0.44 + tyre 0.032)
      # Rounded outward for margin. Derived in mobile_base.xacro - if
      # axle_from_front changes there, recompute these four corners.
      footprint: "[[-0.55, -0.24], [-0.55, 0.24], [0.07, 0.24], [0.07, -0.24]]"
      resolution: 0.05
      rolling_window: true
      width: 20                      # indoor rooms/hallways
      height: 20
      plugins: ["obstacle_layer", "inflation_layer"]   # add a ZED pointcloud voxel_layer here once LIDAR-only baseline is proven
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        combination_method: 1   # max — prevents over-inflation when obstacles overlap
        scan:
          topic: /scan
          obstacle_max_range: 8.0
          obstacle_min_range: 0.15
          raytrace_max_range: 8.0
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # 0.62, just over the CIRCUMSCRIBED radius of 0.6001. That is large,
        # and deliberately so. Because base_link is at the axle the footprint
        # is asymmetric, giving an inscribed radius of only 0.07 - and the
        # costmap only marks cells as definitely-colliding within the
        # INSCRIBED radius. SmacPlanner2D plans for a point and takes all its
        # clearance from inflation, so a small value would let it route the
        # origin 10cm from a wall while 0.55 m of tail swung into it.
        #
        # This is also physically honest: use_rotate_to_heading is true, so
        # the rover may turn in place anywhere along the path, and turning in
        # place sweeps a 0.60 m radius circle. It genuinely needs ~1.2 m of
        # clear space to turn.
        #
        # CONSEQUENCE: standard 0.8 m doorways are effectively impassable and
        # the rover wants wide corridors. The real fix is mechanical - moving
        # the drive wheels rearward toward the chassis middle would roughly
        # halve the swept radius and make the footprint symmetric again. The
        # software alternative is SmacPlannerLattice, which does full SE2
        # footprint collision checking instead of point-plus-inflation.
        inflation_radius: 0.62
        cost_scaling_factor: 2.5       # sharper falloff, less pink spread
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"

local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 10.0   # match the LD19 scan rate; 5.0 discarded every other scan
      publish_frequency: 2.0   # visualisation only -- deliberately low
      transform_tolerance: 0.3
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Half-width 0.24: with wheel_separation 0.44 the outer tyre faces reach
      # 0.44/2 + 0.03195/2 = 0.236, so the old 0.23 cut the wheels out of the
      # footprint and Nav2 would have planned paths that clipped them.
      # Expressed about base_link, which sits at the WHEEL AXLE MIDPOINT, so
      # this polygon is strongly asymmetric - the rover trails its own axle.
      #   chassis    x from -0.5496 to +0.0600   (centre at chassis_x -0.2448)
      #   wheel span y +/-0.2360                 (separation 0.44 + tyre 0.032)
      # Rounded outward for margin. Derived in mobile_base.xacro - if
      # axle_from_front changes there, recompute these four corners.
      footprint: "[[-0.55, -0.24], [-0.55, 0.24], [0.07, 0.24], [0.07, -0.24]]"
      plugins: ["obstacle_layer", "inflation_layer"]   # add a ZED pointcloud voxel_layer here once LIDAR-only baseline is proven
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        combination_method: 1
        scan:
          topic: /scan
          obstacle_max_range: 3.0        # shorter than global — local costmap is 4x4m
          obstacle_min_range: 0.15
          raytrace_max_range: 3.5
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.62         # see the global_costmap note above
        cost_scaling_factor: 2.5
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"
