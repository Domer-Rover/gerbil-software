# Nav2 config for Gerbil: odom-only navigation (no map, no AMCL).
# Obstacle source is /scan from the LD19 LIDAR (360 deg, ~12 m).
# Uses rolling costmaps in the odom frame for obstacle detection.
# Stack: Smac Hybrid-A* (kinematically feasible paths) + RPP (geometric follower).
# The Hybrid-A* choice avoids in-place rotations that stall the weight-biased rover.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered   # EKF (wheel + ZED VIO)
    transform_tolerance: 2.0  # covers ZED TF startup delay (~1-2s after launch)
    default_server_timeout: 20
    default_cancel_timeout: 50
    introspection_mode: "disabled"
    always_reload_bt_xml: false
    bt_log_idle_transitions: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    waypoint_statuses_blackboard_id: waypoint_statuses
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # diff drive — Y velocity is always ~0
    min_theta_velocity_threshold: 0.001
    failure_timeout: 0.3
    odom_topic: /odometry/filtered   # must match bt_navigator
    odom_duration: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_timeout: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.3
      path_length_tolerance: 1.0
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25         # indoor; small robot
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_goal: 1.0
      use_regulated_linear_velocity_scaling: true       # slows on curves — grass stability
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true  # slows near inflation potential field
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.7
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlanner2D: grid planner with no minimum turning radius. The rover is
      # skid-steer, so the Hybrid-A* car model (DUBIN, min radius 0.4 m) refused
      # paths the rover can actually drive.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true            # outdoor rolling costmap is mostly unknown
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # no "spin": the rover stalls pivoting in place, which is also why
    # use_rotate_to_heading is false. Recovery is backup + wait.
    behavior_plugins: ["backup", "drive_on_heading", "wait", "assisted_teleop"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.4

# Both costmaps use odom frame with rolling windows — no static map needed.
# Footprint: rectangular bounding box sized for the rear axle (widest point).
#   X half-length: base_length/2 (0.3556m) + margin → 0.40m
#   Y half-width:  wheel_separation/2 (0.2114m) + half wheel width → 0.23m
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 5.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      global_frame: odom
      robot_base_frame: base_footprint
      footprint: "[[-0.31, -0.23], [-0.31, 0.23], [0.31, 0.23], [0.31, -0.23]]"  # chassis 0.61 long, wheel span 0.455 wide. VERIFY by measuring.
      resolution: 0.05
      rolling_window: true
      width: 20                      # indoor rooms/hallways
      height: 20
      plugins: ["obstacle_layer", "inflation_layer"]   # add a ZED pointcloud voxel_layer here once LIDAR-only baseline is proven
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        combination_method: 1   # max — prevents over-inflation when obstacles overlap
        scan:
          topic: /scan
          obstacle_max_range: 8.0
          obstacle_min_range: 0.15
          raytrace_max_range: 8.0
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45         # must exceed the circumscribed radius (0.39 m for this footprint)
        cost_scaling_factor: 2.5       # sharper falloff, less pink spread
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"

local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.31, -0.23], [-0.31, 0.23], [0.31, 0.23], [0.31, -0.23]]"  # chassis 0.61 long, wheel span 0.455 wide. VERIFY by measuring.
      plugins: ["obstacle_layer", "inflation_layer"]   # add a ZED pointcloud voxel_layer here once LIDAR-only baseline is proven
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        combination_method: 1
        scan:
          topic: /scan
          obstacle_max_range: 3.0        # shorter than global — local costmap is 4x4m
          obstacle_min_range: 0.15
          raytrace_max_range: 3.5
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 2.5
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"
