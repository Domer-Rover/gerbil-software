# colcon defaults for the gerbil-sim container (COLCON_DEFAULTS_FILE points here).
# This is the single source of truth for what is skipped in simulation:
#   zed_*            need the ZED SDK / CUDA, which the sim image does not have
#   gerbil_hw        real RoboClaw hardware interface (sim uses ign_ros2_control)
#   roboclaw_serial  serial driver for the real motor controller
#   ldlidar_stl_ros2 real LiDAR driver (sim uses a gpu_lidar sensor)
build:
  symlink-install: true
  packages-ignore:
    - zed_components
    - zed_wrapper
    - zed_ros2
    - zed_debug
    - gerbil_hw
    - roboclaw_serial
    - ldlidar_stl_ros2
