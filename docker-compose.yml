services:
  # For simulation (Gazebo Fortress on Apple Silicon or x86), use gerbil-sim below.
  # ros-dev is the older general dev desktop; it shares port 6080, so run one at a time.
  ros-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: gerbil-dev
    ports:
      - "6080:80"
    shm_size: '512m'
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./src:/home/ubuntu/ros2_ws/src
    command: /bin/bash -c "supervisord -c /etc/supervisor/supervisord.conf"

  ros-jetson:
    build:
      context: .
      dockerfile: docker/Dockerfile.jetson
    container_name: gerbil-jetson
    network_mode: host
    privileged: true
    shm_size: '512m'
    volumes:
      - ./src:/home/ubuntu/ros2_ws/src
    devices:
      - /dev/ttyTHS1:/dev/ttyTHS1
      - /dev/video0:/dev/video0
      - /dev/i2c-1:/dev/i2c-1
    command: /bin/bash -c "tail -f /dev/null"

  gerbil-sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    image: gerbil-sim:humble
    container_name: gerbil-sim
    ports:
      - "6080:80"      # noVNC desktop: http://localhost:6080 (password: ubuntu)
      - "8765:8765"    # foxglove_bridge
    shm_size: '2g'
    security_opt:
      - seccomp:unconfined   # required by the Jammy-based VNC image
    volumes:
      - ./src:/home/ubuntu/ros2_ws/src
      # colcon output lives in named volumes: persists across restarts and avoids
      # slow macOS bind mounts. Wipe with `docker compose down -v` after image changes.
      - gerbil-sim-build:/home/ubuntu/ros2_ws/build
      - gerbil-sim-install:/home/ubuntu/ros2_ws/install
      - gerbil-sim-log:/home/ubuntu/ros2_ws/log

volumes:
  gerbil-sim-build:
  gerbil-sim-install:
  gerbil-sim-log:
